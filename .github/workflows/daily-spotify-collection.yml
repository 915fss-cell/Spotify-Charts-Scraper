name: Spotify chart collection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-spotify-chart-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run collection from GitHub Actions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "::error::Add CRON_SECRET in the repository's Actions secrets."
            exit 1
          fi

          batch=0
          while true; do
            batch=$((batch + 1))
            response="$(curl --silent --show-error --fail-with-body --max-time 600 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "https://spotify-charts-scraper.vercel.app/api/collection/workflow")"
            echo "${response}" | jq .

            status="$(echo "${response}" | jq -r '.status // empty')"
            failed="$(echo "${response}" | jq -r '.failedChartKeys // 0')"
            if [[ "${failed}" -gt 0 ]]; then
              rate_limited="$(echo "${response}" | jq '[.summaryError // "" | scan("HTTP 429")] | length')"
              if [[ "${rate_limited}" -ne "${failed}" ]]; then
                echo "::error::Collection batch ${batch} did not succeed (status: ${status:-missing}). Inspect this run's response above."
                exit 1
              fi
              echo "::warning::Spotify rate-limited ${failed} chart request(s); waiting before retrying the batch."
              sleep 120
            elif [[ "${status}" != "succeeded" && "${status}" != "partial" ]]; then
              echo "::error::Collection batch ${batch} did not succeed (status: ${status:-missing}). Inspect this run's response above."
              exit 1
            fi

            requested="$(echo "${response}" | jq -r '.requestedChartKeys // 0')"
            if [[ "${requested}" == "0" ]]; then
              echo "All eligible chart and market combinations have been processed."
              break
            fi
          done
