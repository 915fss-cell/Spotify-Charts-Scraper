name: Spotify chart collection

on:
  workflow_dispatch:
    inputs:
      daily_top_songs:
        description: Daily top songs (leave all unchecked to load every chart)
        type: boolean
        required: false
        default: false
      daily_viral_songs:
        description: Daily viral songs
        type: boolean
        required: false
        default: false
      weekly_top_songs:
        description: Weekly top songs
        type: boolean
        required: false
        default: false
      daily_top_artists:
        description: Daily top artists
        type: boolean
        required: false
        default: false
      weekly_top_artists:
        description: Weekly top artists
        type: boolean
        required: false
        default: false
      weekly_top_albums:
        description: Weekly top albums
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: daily-spotify-chart-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Run collection from GitHub Actions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAILY_TOP_SONGS: ${{ inputs.daily_top_songs }}
          DAILY_VIRAL_SONGS: ${{ inputs.daily_viral_songs }}
          WEEKLY_TOP_SONGS: ${{ inputs.weekly_top_songs }}
          DAILY_TOP_ARTISTS: ${{ inputs.daily_top_artists }}
          WEEKLY_TOP_ARTISTS: ${{ inputs.weekly_top_artists }}
          WEEKLY_TOP_ALBUMS: ${{ inputs.weekly_top_albums }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "::error::Add CRON_SECRET in the repository's Actions secrets."
            exit 1
          fi

          chart_types='[]'
          append_chart_type() {
            chart_types="$(jq -c --arg chart "$1" '. + [$chart]' <<< "${chart_types}")"
          }

          if [[ "${DAILY_TOP_SONGS}" == "true" ]]; then append_chart_type "daily_top_songs"; fi
          if [[ "${DAILY_VIRAL_SONGS}" == "true" ]]; then append_chart_type "daily_viral_songs"; fi
          if [[ "${WEEKLY_TOP_SONGS}" == "true" ]]; then append_chart_type "weekly_top_songs"; fi
          if [[ "${DAILY_TOP_ARTISTS}" == "true" ]]; then append_chart_type "daily_top_artists"; fi
          if [[ "${WEEKLY_TOP_ARTISTS}" == "true" ]]; then append_chart_type "weekly_top_artists"; fi
          if [[ "${WEEKLY_TOP_ALBUMS}" == "true" ]]; then append_chart_type "weekly_top_albums"; fi

          if [[ "${chart_types}" == "[]" ]]; then
            echo "No chart selected; loading all supported charts."
          else
            echo "Loading selected charts: $(jq -r 'join(", ")' <<< "${chart_types}")"
          fi
          request_body="$(jq -nc --argjson chartTypes "${chart_types}" '{chartTypes: $chartTypes}')"

          batch=0
          while true; do
            batch=$((batch + 1))
            response="$(curl --silent --show-error --fail-with-body --max-time 600 \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              --header "Content-Type: application/json" \
              --data "${request_body}" \
              "https://spotify-charts-scraper.vercel.app/api/collection/workflow")"
            echo "${response}" | jq .

            status="$(echo "${response}" | jq -r '.status // empty')"
            failed="$(echo "${response}" | jq -r '.failedChartKeys // 0')"
            if [[ "${failed}" -gt 0 ]]; then
              rate_limited="$(echo "${response}" | jq '[.summaryError // "" | scan("HTTP 429")] | length')"
              if [[ "${rate_limited}" -ne "${failed}" ]]; then
                echo "::error::Collection batch ${batch} did not succeed (status: ${status:-missing}). Inspect this run's response above."
                exit 1
              fi
              echo "::warning::Spotify rate-limited ${failed} chart request(s); waiting before retrying the batch."
              sleep 120
            elif [[ "${status}" != "succeeded" && "${status}" != "partial" ]]; then
              echo "::error::Collection batch ${batch} did not succeed (status: ${status:-missing}). Inspect this run's response above."
              exit 1
            fi

            requested="$(echo "${response}" | jq -r '.requestedChartKeys // 0')"
            if [[ "${requested}" == "0" ]]; then
              echo "All eligible chart and market combinations have been processed."
              break
            fi
          done
