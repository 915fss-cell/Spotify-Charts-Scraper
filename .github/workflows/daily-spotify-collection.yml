name: Spotify chart collection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-spotify-chart-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run collection from GitHub Actions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "::error::Add CRON_SECRET in the repository's Actions secrets."
            exit 1
          fi

          response="$(curl --silent --show-error --fail-with-body --max-time 600 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://spotify-charts-scraper.vercel.app/api/collection/workflow")"
          echo "${response}" | jq .

          status="$(echo "${response}" | jq -r '.status // empty')"
          if [[ "${status}" != "succeeded" ]]; then
            echo "::error::Collection did not succeed (status: ${status:-missing}). Inspect this run's response above."
            exit 1
          fi
